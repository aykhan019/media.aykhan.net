name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # generate_index.py reads git log for commit times

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate index files
        run: python generate_index.py

      - name: Disable Jekyll and drop git history from the artifact
        run: |
          touch .nojekyll
          rm -rf .git

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
