<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon"
        href="https://res.cloudinary.com/dbriqxpaa/image/upload/v1680096853/Logo/logo-xl-ico_qzbf7d.ico" />
    <title>media.aykhan.net | thumbnails | notion | coursera</title>
    <script>
        // Apply saved theme before paint to avoid a flash. Dark is the default.
        (function () {
            try {
                if (localStorage.getItem('aykhan-listing-theme') === 'light') {
                    document.documentElement.classList.add('light');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        /* Palette mirrors aykhan.net/terminal so all three properties match. */
        :root {
            --bg: #0d1117;
            --panel: #11161d;
            --bar: #1c232c;
            --text: #c9d1d9;
            --muted: #6e7681;
            --accent: #f06449;
            --green: #3fb950;
            --link: #58a6ff;
            --border: #21262d;
            --selection: #234a6b;
            --mono: "SF Mono", "Fira Code", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
        }
        html.light {
            --bg: #ffffff;
            --panel: #f6f8fa;
            --bar: #eaeef2;
            --text: #1f2328;
            --muted: #656d76;
            --accent: #d03a1f;
            --green: #1a7f37;
            --link: #0969da;
            --border: #d0d7de;
            --selection: #ddf4ff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            font-size: 14px;
            line-height: 1.55;
            padding: 0;
        }
        ::selection { background: var(--selection); }
        .window {
            width: 100%;
            min-height: 100vh;
            background: var(--panel);
            border: 0;
            border-radius: 0;
            overflow: hidden;
        }
        .titlebar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 14px;
            background: var(--bar);
            border-bottom: 1px solid var(--border);
        }
        .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }
        .titlebar-text {
            margin-left: 6px;
            color: var(--muted);
            font-size: 12.5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .crumb {
            padding: 16px 18px 8px;
        }
        .crumb h1 {
            margin: 0;
            font-size: 1em;
            font-weight: 400;
            line-height: 1.7;
            color: var(--text);
            word-break: break-word;
        }
        .crumb h1::before {
            content: "$ ls ";
            color: var(--green);
        }
        .crumb-current { color: var(--text); }
        .crumb-sep { color: var(--muted); margin: 0 6px; }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            position: sticky;
            top: 0;
            text-align: left;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            background: var(--panel);
            padding: 9px 14px;
            border-bottom: 1px solid var(--border);
        }
        tbody td {
            padding: 7px 14px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover { background: var(--selection); }
        td.icon-col { width: 34px; text-align: center; }
        td:nth-child(3) { color: var(--muted); }
        td:nth-child(4) { color: var(--muted); font-size: 12.5px; }
        a { color: var(--link); text-decoration: none; }
        a:hover { color: var(--accent); text-decoration: underline; }
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px;
            font-family: var(--mono);
            font-size: 12.5px;
            cursor: pointer;
            z-index: 1000;
        }
        .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
        @media (max-width: 560px) {
            thead th:nth-child(3), td:nth-child(3) { display: none; }
        }
    </style>
</head>
<body>
    <!-- Auto-generated by Python script -->
    <div class="window">
        <div class="titlebar">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="titlebar-text">media.aykhan.net | thumbnails | notion | coursera</span>
        </div>
        <div class="crumb">
            <h1><a href="../../../index.html">media.aykhan.net</a><span class="crumb-sep">/</span><a href="../../index.html">thumbnails</a><span class="crumb-sep">/</span><a href="../index.html">notion</a><span class="crumb-sep">/</span><span class="crumb-current">coursera</span></h1>
        </div>
        <table>
            <thead>
                <tr>
                    <th class="icon-col">·</th>
                    <th>Name</th>
                    <th>Size</th>
                    <th>Last Modified</th>
                </tr>
            </thead>
            <tbody>
            <tr><td class="icon-col">📁</td><td><a href="ibm/index.html">ibm/</a></td><td>-</td><td>2026-06-12 21:09 UTC</td></tr>
        <tr><td class="icon-col">📄</td><td><a href="coursera.jpg">coursera.jpg</a></td><td>51.2 KB</td><td>2024-09-01 12:59 UTC</td></tr>
            </tbody>
        </table>
    </div>

    <button class="theme-toggle" type="button" onclick="__toggleTheme()">☾ dark</button>
    <script>
        (function () {
            var KEY = 'aykhan-listing-theme';
            function label() {
                var b = document.querySelector('.theme-toggle');
                if (!b) return;
                b.textContent = document.documentElement.classList.contains('light') ? '☀ light' : '☾ dark';
            }
            window.__toggleTheme = function () {
                var light = !document.documentElement.classList.contains('light');
                document.documentElement.classList.toggle('light', light);
                try { localStorage.setItem(KEY, light ? 'light' : 'dark'); } catch (e) {}
                label();
            };
            document.addEventListener('DOMContentLoaded', label);
        })();
    </script>
</body>
</html>
